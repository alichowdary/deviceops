app = 'deviceops-mqtt-prod'
primary_region = 'iad'

kill_signal = 'SIGTERM'
kill_timeout = '30s'

[build]

[[mounts]]
  source = 'mosquitto_data'
  destination = '/mosquitto/data'

[[services]]
  protocol = 'tcp'
  internal_port = 1883
  auto_stop_machines = 'off'
  auto_start_machines = false
  min_machines_running = 1
  processes = ['app']

  [[services.ports]]
    port = 443
    handlers = ['tls']

  [[services.tcp_checks]]
    interval = '15s'
    timeout = '2s'
    grace_period = '10s'

[[vm]]
  size = 'shared-cpu-1x'
  memory = '256mb'
  cpu_kind = 'shared'
  cpus = 1
