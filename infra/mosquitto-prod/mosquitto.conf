# Fly Proxy terminates public TLS and forwards raw MQTT over private TCP here.
listener 1883 0.0.0.0
protocol mqtt

# Production clients must authenticate through Dynamic Security.
allow_anonymous false
plugin /usr/lib/mosquitto_dynamic_security.so
plugin_opt_config_file /mosquitto/data/dynamic-security.json

# Persist retained messages and durable MQTT session state on the Fly volume.
persistence true
persistence_location /mosquitto/data/
persistence_file mosquitto.db
autosave_interval 60
autosave_on_changes false

# Keep the broker in the foreground so container signals reach it directly.
user mosquitto

# Useful operational logs go to the container log stream. Passwords are never logged.
log_dest stdout
log_timestamp true
log_timestamp_format %Y-%m-%dT%H:%M:%S
log_type error
log_type warning
log_type notice
log_type information
connection_messages true
