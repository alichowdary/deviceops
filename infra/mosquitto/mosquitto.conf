# Plain MQTT over TCP. Docker publishes this listener for local LAN hardware tests.
listener 1883

# LOCAL DEVELOPMENT ONLY: anonymous MQTT access is intentionally insecure.
# Production uses a separate broker with authentication and verified TLS.
allow_anonymous true

# Keep broker state in memory; local development does not require persistence.
persistence false

# Send logs to Docker so they are visible with docker compose logs.
log_dest stdout
