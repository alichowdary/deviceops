# Plain MQTT over TCP. Docker limits the published port to the host's loopback.
listener 1883

# LOCAL DEVELOPMENT ONLY: anonymous MQTT access is intentionally insecure.
# Replace this with authenticated device access in a later milestone.
allow_anonymous true

# Keep broker state in memory; no on-disk persistence is needed for this test.
persistence false

# Send logs to Docker so they are visible with docker compose logs.
log_dest stdout
