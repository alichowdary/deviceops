services:
  mosquitto:
    image: eclipse-mosquitto:2.1.2-alpine
    ports:
      # Local development only: expose MQTT on this computer's loopback address.
      - "127.0.0.1:1883:1883"
    volumes:
      # Mount our broker configuration read-only.
      - ./infra/mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro

  postgres:
    image: postgres:18.6-alpine
    environment:
      # Local-development credentials only. Override these environment variables as needed.
      POSTGRES_DB: ${POSTGRES_DB:-deviceops}
      POSTGRES_USER: ${POSTGRES_USER:-deviceops}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-deviceops-local}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      # PostgreSQL 18 stores its versioned data directory beneath this path.
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
