name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build

  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            apps/api/pyproject.toml
            simulator/pyproject.toml
      - name: Test simulator
        working-directory: simulator
        run: |
          python -m pip install -e .
          python -m unittest discover -s tests -v
      - name: Test stable API subset
        working-directory: apps/api
        run: |
          python -m pip install -e .
          python -m unittest discover -s tests -p 'test_broker_password_derivation.py' -v
          python -m unittest discover -s tests -p 'test_mqtt_configuration.py' -v
          python -m unittest discover -s tests -p 'test_broker_provisioning.py' -v

  firmware:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install platformio==6.1.18
      - name: Build ESP32 reference firmware with placeholders
        run: |
          cp firmware/esp32/include/secrets.example.h firmware/esp32/include/secrets.h
          pio run -d firmware/esp32
